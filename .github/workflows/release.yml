name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          manifest=$(jq -r .version custom_components/weather_station_api/manifest.json)
          if [ "$manifest" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match manifest version $manifest"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
